<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070c" />
  <title>Beats Bots</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Vercel Web Analytics (plain-HTML setup; the script is served by Vercel once deployed) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header>
    <h1>BEATS<span>·</span>BOTS</h1>
    <p>Codex · Claude · Grok — drop a track and watch them move</p>
  </header>

  <aside id="panel">
    <div class="row">
      <button id="add" class="primary">＋ Add music</button>
      <button id="beats" aria-haspopup="true">🎧 Beats <span class="caret">▾</span></button>
      <input id="file" type="file" accept="audio/*" multiple hidden />
    </div>
    <ul id="beatmenu" hidden></ul>

    <p id="empty">No tracks yet. Pick one from <b>Beats</b>, add your own audio files (mp3, wav, ogg…), or drag them anywhere onto the page.</p>

    <div id="player" hidden>
      <div class="now">
        <span id="beatdot"></span>
        <span id="title">—</span>
        <span id="bpm"></span>
        <button id="listToggle" title="Show / hide playlist">☰ <span id="count">0</span></button>
      </div>
      <div class="transport">
        <button id="prev" title="Previous">⏮</button>
        <button id="play" class="primary round" title="Play / pause">▶</button>
        <button id="next" title="Next">⏭</button>
        <label class="vol" title="Volume">🔊<input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
      </div>
      <div class="seekrow">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
        <span id="dur">0:00</span>
      </div>
      <ol id="playlist"></ol>
    </div>
  </aside>

  <div id="dropmask">Drop audio to add it</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
